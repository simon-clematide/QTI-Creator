[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qti-creator"
dynamic = ["version"]
description = "Author OpenOLAT-compatible IMS QTI 2.1 quizzes in clean Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.0",
    "genanki>=0.13.1,<0.14",
]

[project.optional-dependencies]
ui = [
    "gradio>=4.44.0",
]

[tool.setuptools.dynamic]
version = {attr = "qti_creator.core.version.__version__"}

[tool.setuptools.packages.find]
include = ["qti_creator*"]

[tool.setuptools.package-data]
qti_creator = ["assets/**/*", "core/java/**/*"]
